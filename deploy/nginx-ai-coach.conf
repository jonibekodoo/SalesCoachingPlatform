# ── Sales Coaching Platform (/opt/ai-coach) ─────────────────────────────
# ai-coach.biznesim.uz → docker ai-coach (127.0.0.1:4010): admin panel + /api

upstream ai_coach { server 127.0.0.1:4010; }

server {
    listen 80;
    server_name ai-coach.biznesim.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ai-coach.biznesim.uz;

    ssl_certificate     /etc/letsencrypt/live/ai-coach.biznesim.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-coach.biznesim.uz/privkey.pem;

    # Audio uploads up to 60 MB (+ base64 overhead) and slow Gemini analyses
    client_max_body_size 90m;
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_request_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / { proxy_pass http://ai_coach; }
}
